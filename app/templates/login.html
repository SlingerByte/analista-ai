<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar | {{ app_name }}</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
              --c-primary:#154c79; --c-primary-dark:#063970; --c-accent:#1e81b0; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             padding: 1rem; color: #21130d;
             background: linear-gradient(160deg, #063970, #154c79 55%, #1e81b0); }
      .login { width: min(24rem, 100%); background: #fff; border-radius: 18px;
               padding: 1.75rem 1.6rem 1.5rem; box-shadow: 0 12px 32px rgba(6,57,112,.35); }
      .brand { display: flex; align-items: center; gap: .6rem; }
      .mark { width: 2.4rem; height: 2.4rem; border-radius: 12px; background: var(--c-primary);
              color: #fff; display: grid; place-items: center; font-weight: 800;
              font-size: 1.05rem; flex: 0 0 auto; }
      .login h1 { margin: 0; font-size: 1.15rem; color: var(--c-primary-dark);
                  line-height: 1.2; }
      .sub { margin: .35rem 0 1rem; color: #4b5563; font-size: .9rem; }
      label { display: grid; gap: .3rem; margin-top: .85rem; font-weight: 600;
              font-size: .9rem; }
      input { width: 100%; font: inherit; padding: .6rem .7rem; min-height: 44px;
              border: 1px solid #d7dee5; border-radius: 10px; background: #fff; }
      input:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 2px; }
      button { width: 100%; margin-top: 1.25rem; min-height: 46px; padding: .65rem;
               font: inherit; font-weight: 700; border: 0; border-radius: 10px;
               background: var(--c-accent); color: #fff; cursor: pointer; }
      button:hover { background: var(--c-primary); }
      .error { margin-top: 1rem; padding: .6rem .8rem; border-radius: 10px;
               background: #f7e4dc; border: 1px solid #d8a08c; color: #7a2f12;
               font-size: .9rem; }
      .foot { margin: 1.1rem 0 0; text-align: center; color: #4b5563; font-size: .75rem; }
      @media (max-width: 420px) { .login { padding: 1.4rem 1.1rem 1.2rem; } }
    </style>
  </head>
  <body>
    <main class="login">
      <div class="brand">
        <span class="mark">IA</span>
        <h1>{{ app_name }}</h1>
      </div>
      <p class="sub">Ingreso de asesores y supervisores</p>
      <form method="post" action="/login">
        <label>Usuario
          <input type="email" name="email" required autocomplete="username" />
        </label>
        <label>Contraseña
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit">Ingresar</button>
      </form>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <p class="foot">Acceso restringido · información aislada por empresa</p>
    </main>
  </body>
</html>
