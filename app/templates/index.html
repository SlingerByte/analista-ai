<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 40rem;
        padding: 2.5rem;
        border: 1px solid #1e293b;
        border-radius: 0.75rem;
        background: #111827;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      ul {
        padding-left: 1.25rem;
        line-height: 1.8;
      }
      code,
      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ app_name }}</h1>
      <p>Sistema de gestion y priorizacion comercial basado en datos y conversaciones.</p>
      <ul>
        <li>Entorno: <strong>{{ app_env }}</strong></li>
        <li>Estado de la aplicacion: <strong>ok</strong></li>
        <li>Base de datos: <strong>{{ database }}</strong></li>
      </ul>
      <p>
        <a href="/health">/health</a> ·
        <a href="/docs">/docs</a>
      </p>
    </main>
  </body>
</html>
