[project]
name = "analista-ai"
version = "0.1.0"
description = "Priorizacion inteligente de leads comerciales"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "jinja2>=3.1,<4.0",
    "pydantic-settings>=2.4,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.uv]
package = false
