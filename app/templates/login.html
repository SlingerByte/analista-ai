<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar | {{ app_name }}</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #0f172a; color: #e2e8f0; }
      main { width: 22rem; padding: 2rem; border: 1px solid #1e293b;
             border-radius: 0.75rem; background: #111827; }
      h1 { margin: 0; font-size: 1.2rem; text-align: center; }
      p.sub { text-align: center; color: #94a3b8; font-size: 0.9rem; }
      label { display: grid; gap: 0.3rem; margin-top: 1rem; font-size: 0.9rem; }
      input { padding: 0.55rem 0.7rem; font-size: 1rem; border-radius: 0.4rem;
              border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
      button { width: 100%; margin-top: 1.25rem; padding: 0.65rem; font-size: 1rem;
               font-weight: 700; border: 0; border-radius: 0.4rem;
               background: #2563eb; color: #fff; cursor: pointer; }
      .error { margin-top: 1rem; padding: 0.6rem; border-radius: 0.4rem;
               background: #450a0a; color: #fecaca; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Motos &amp; Motores</h1>
      <p class="sub">Gestión de Leads</p>
      <form method="post" action="/login">
        <label>Usuario
          <input type="email" name="email" required autocomplete="username" />
        </label>
        <label>Contraseña
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit">Ingresar</button>
      </form>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </main>
  </body>
</html>
